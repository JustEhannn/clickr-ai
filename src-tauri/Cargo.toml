[package]
name = "clickr"
version = "0.4.1"
description = "Clickr — the AI copilot that sees your screen"
authors = ["Clickr"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clickr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }


[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
screencapturekit = { version = "9", features = ["macos_14_0"] }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = ["NSEvent", "NSScreen", "NSResponder", "NSApplication", "NSWindow", "NSPasteboard", "NSRunningApplication"] }
objc2-foundation = "=0.3.2"
block2 = "0.6.2"
core-graphics = "0.24"
core-foundation = "0.9"
foreign-types = "0.5"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
